<div class="form-overlay">
  <div class="form-modal" role="dialog" aria-modal="true" aria-labelledby="expense-form-titulo">
    <header class="form-header">
      <h2 id="expense-form-titulo">{{ emEdicao ? 'Editar despesa' : 'Nova despesa' }}</h2>
      <button
        type="button"
        class="modal-fechar"
        aria-label="Fechar"
        title="Fechar"
        (click)="cancelar()"
      >
        ✕
      </button>
    </header>

    <div class="form-body">
      <div class="modo-tabs" *ngIf="!emEdicao">
        <button type="button" [class.active]="modo === 'unica'" (click)="selecionarModo('unica')">
          Única
        </button>
        <button
          type="button"
          [class.active]="modo === 'parcelada'"
          (click)="selecionarModo('parcelada')"
        >
          Parcelada
        </button>
        <button
          type="button"
          [class.active]="modo === 'recorrente'"
          (click)="selecionarModo('recorrente')"
        >
          Recorrente
        </button>
      </div>

      <div class="form-grid">
        <div class="form-group span-2">
          <label for="ef-description">Descrição</label>
          <input
            id="ef-description"
            type="text"
            name="description"
            [(ngModel)]="novaDespesa.description"
            placeholder="Ex: Aluguel do galpão"
          />
        </div>

        <div class="form-group">
          <label for="ef-value">{{
            modo === 'parcelada' ? 'Valor total (R$)' : 'Valor (R$)'
          }}</label>
          <input
            id="ef-value"
            type="number"
            name="value"
            [(ngModel)]="novaDespesa.value"
            min="0.01"
            step="0.01"
          />
        </div>
        <div class="form-group">
          <label for="ef-due" *ngIf="modo === 'unica'">Vencimento</label>
          <label for="ef-due" *ngIf="modo === 'parcelada'">1º vencimento</label>
          <label for="ef-due" *ngIf="modo === 'recorrente'">Primeiro vencimento</label>
          <input id="ef-due" type="date" name="dueDate" [(ngModel)]="novaDespesa.dueDate" />
          <small class="aviso" *ngIf="ancoraMuitoAntiga">
            ⚠️ Data a mais de {{ maxAnchorMonthsInPast }} meses no passado: serão geradas todas as
            ocorrências até o fim do mês atual.
          </small>
        </div>

        <div class="form-group">
          <label for="ef-category">Categoria</label>
          <select id="ef-category" name="categoryId" [(ngModel)]="novaDespesa.categoryId">
            <option value="">Selecione...</option>
            <option *ngFor="let c of categoriasSelecionaveis" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ef-payment">
            Forma de pagamento <span class="opcional">(opcional)</span>
          </label>
          <select id="ef-payment" name="paymentMethod" [(ngModel)]="novaDespesa.paymentMethod">
            <option value="">—</option>
            <option *ngFor="let m of paymentMethods" [value]="m.value">{{ m.label }}</option>
          </select>
        </div>

        <div class="form-group" *ngIf="modo === 'parcelada'">
          <label for="ef-parcelas">Parcelas</label>
          <input
            id="ef-parcelas"
            type="number"
            name="parcelas"
            [(ngModel)]="parcelas"
            [min]="minInstallments"
            [max]="maxInstallments"
            step="1"
          />
        </div>
        <div class="form-group" *ngIf="modo === 'recorrente'">
          <label for="ef-periodo">Período</label>
          <select id="ef-periodo" name="periodo" [(ngModel)]="periodo">
            <option value="semanal">Semanal</option>
            <option value="mensal">Mensal</option>
          </select>
        </div>
        <div class="form-group" *ngIf="modo === 'unica'">
          <label for="ef-received">
            Mercadoria recebida em <span class="opcional">(opcional)</span>
          </label>
          <input
            id="ef-received"
            type="date"
            name="goodsReceivedDate"
            [(ngModel)]="novaDespesa.goodsReceivedDate"
          />
        </div>

        <div class="form-group span-2">
          <label for="ef-supplier">Fornecedor <span class="opcional">(opcional)</span></label>
          <input id="ef-supplier" type="text" name="supplier" [(ngModel)]="novaDespesa.supplier" />
        </div>

        <div class="form-group span-2">
          <label for="ef-notes">Observação <span class="opcional">(opcional)</span></label>
          <textarea id="ef-notes" name="notes" rows="3" [(ngModel)]="novaDespesa.notes"></textarea>
        </div>
      </div>
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      <button type="button" class="btn-salvar" (click)="salvar()">Salvar</button>
    </footer>
  </div>
</div>
