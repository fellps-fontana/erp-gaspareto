<div class="home-container">
  <button
    type="button"
    class="theme-toggle-fab"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDarkTheme() ? 'Ativar modo claro' : 'Ativar modo escuro'"
    [title]="theme.isDarkTheme() ? 'Modo claro' : 'Modo escuro'"
  >
    <span class="theme-toggle-fab__icons" aria-hidden="true">
      <svg
        class="theme-toggle-fab__draw theme-toggle-fab__draw-sun"
        [class.theme-toggle-fab__draw--active]="theme.isDarkTheme()"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="12" cy="12" r="3.75" stroke="currentColor" stroke-width="1.6" />
        <path
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          d="M12 4.75V3M12 21v-1.75M4.97 6.76l-.88-.88M18.94 17.94l-.88-.88M4.76 17.94l.88-.88M18.04 6.76l-.88.88M3 12h1.75M21 12h-1.75"
        />
      </svg>
      <svg
        class="theme-toggle-fab__draw theme-toggle-fab__draw-moon"
        [class.theme-toggle-fab__draw--active]="!theme.isDarkTheme()"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke="currentColor"
          stroke-width="1.65"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 13.207A8.5 8.5 0 1 1 11.182 6.079a7 7 0 0 0 9.818 7.129Z"
        />
      </svg>
    </span>
  </button>

  <div class="header">
    <h1>SISTEMA DE EVENTOS</h1>
    <p>Selecione o módulo de acesso</p>
  </div>

  <div class="grid-menu">
    <div [routerLink]="['/pdv']" class="menu-card card-pdv">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"
          />
        </svg>
      </div>
      <span class="label">PDV <br /><small>Venda Balcão</small></span>
    </div>

    <div [routerLink]="['/orders']" class="menu-card card-orders">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"
          />
        </svg>
      </div>
      <span class="label">PEDIDOS <br /><small>Encomendas & Cozinha</small></span>
    </div>

    <div [routerLink]="['/estoque']" class="menu-card card-admin">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"
          />
        </svg>
      </div>
      <span class="label">GESTÃO <br /><small>Estoque & Relatórios</small></span>
    </div>

<div [routerLink]="['/rotas']" class="menu-card card-routes">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
          />
        </svg>
      </div>
      <span class="label">ROTAS <br /><small>Entregas & Navegação</small></span>
    </div>

    <div [routerLink]="['/contas']" class="menu-card card-bills">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 18v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1h-9a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9zm-9-2h10V8H12v8zm4-2.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
        </svg>
      </div>
      <span class="label">CONTAS <br /><small>Contas a Pagar</small></span>
    </div>
  </div>
</div>
