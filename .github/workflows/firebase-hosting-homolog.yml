# Deploy automático para o ambiente de HOMOLOGAÇÃO (projeto Firebase: hologaerp).
# Espelha o workflow de produção (firebase-hosting-merge.yml), mas dispara na
# branch `homologacao` e builda com a configuration `staging` (usa
# src/enviroments/enviroments.staging.ts em vez do enviroments.ts de produção).

name: Deploy to Firebase Hosting on homologacao push
on:
  push:
    branches:
      - homologacao
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npx ng build --configuration staging
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOLOGAERP }}
          channelId: live
          projectId: hologaerp
